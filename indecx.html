<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You, Abang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fff2f4;
    --petal:#ffd6e0;
    --rose:#e8607a;
    --rose-deep:#b23a55;
    --wine:#7a1f36;
    --cream:#fffaf7;
    --gold:#e9b8a4;
    --glow: 255,214,224;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    width:100%;
    overflow-x:hidden;
    background:
      radial-gradient(ellipse at 20% 10%, #ffe3ea 0%, transparent 55%),
      radial-gradient(ellipse at 85% 85%, #ffd9e4 0%, transparent 50%),
      linear-gradient(160deg, var(--blush) 0%, #fbe4ea 45%, #f7d7e0 100%);
    font-family: 'Cormorant Garamond', serif;
    color: var(--wine);
    cursor: default;
    position:relative;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- background canvases ---------- */
  #hearts-canvas, #particle-canvas{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:1;
  }
  #particle-canvas{ z-index:0; }

  /* ---------- top controls ---------- */
  .controls{
    position:fixed;
    top:22px;
    right:22px;
    z-index:50;
    display:flex;
    gap:10px;
  }

  .icon-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid rgba(178,58,85,0.25);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform .35s ease, box-shadow .35s ease, background .35s ease;
    box-shadow: 0 4px 16px rgba(178,58,85,0.12);
  }
  .icon-btn:hover{
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 22px rgba(178,58,85,0.22);
    background: rgba(255,255,255,0.85);
  }
  .icon-btn svg{ width:20px; height:20px; }
  .icon-btn.playing .sound-bars rect{
    animation: bar-bounce 0.9s ease-in-out infinite;
  }
  .sound-bars rect:nth-child(1){ animation-delay: 0s; }
  .sound-bars rect:nth-child(2){ animation-delay: 0.15s; }
  .sound-bars rect:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bar-bounce{
    0%,100%{ transform: scaleY(0.4); }
    50%{ transform: scaleY(1); }
  }

  /* ---------- hero ---------- */
  .stage{
    position:relative;
    z-index:5;
    min-height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 8vh 6vw 10vh;
    text-align:center;
  }

  .kicker{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(0.85rem, 1.6vw, 1.15rem);
    letter-spacing: 0.08em;
    color: var(--rose-deep);
    opacity:0;
    animation: rise-in 1.1s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
  }

  h1.hero-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size: clamp(2.6rem, 9vw, 6.4rem);
    line-height:1.04;
    letter-spacing: -0.01em;
    color: var(--wine);
    margin: 0.35em 0 0.3em;
    opacity:0;
    transform: translateY(28px) scale(0.96);
    animation: rise-in 1.3s cubic-bezier(.2,.8,.2,1) 0.4s forwards;
    text-shadow: 0 2px 30px rgba(232,96,122,0.25);
  }

  h1.hero-title .heart{
    display:inline-block;
    color: var(--rose);
    animation: heartbeat 1.8s ease-in-out 1.8s infinite;
    transform-origin:center;
  }

  h1.hero-title .name{
    color: var(--rose);
    font-style:italic;
    position:relative;
    white-space:nowrap;
  }

  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    15%{ transform:scale(1.18); }
    30%{ transform:scale(1); }
    45%{ transform:scale(1.12); }
    60%{ transform:scale(1); }
  }

  @keyframes rise-in{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .subtext{
    font-size: clamp(1.05rem, 2vw, 1.35rem);
    max-width: 34ch;
    color: var(--rose-deep);
    font-weight:400;
    opacity:0;
    animation: rise-in 1.1s cubic-bezier(.2,.8,.2,1) 0.8s forwards;
    margin-bottom: 2.6rem;
  }

  .cta{
    opacity:0;
    animation: rise-in 1.1s cubic-bezier(.2,.8,.2,1) 1.05s forwards;
  }

  .love-btn{
    position:relative;
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(1.05rem, 2vw, 1.25rem);
    font-weight:600;
    letter-spacing:0.02em;
    color: var(--cream);
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    border:none;
    padding: 1rem 2.6rem;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(178,58,85,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    overflow:hidden;
  }
  .love-btn:hover{
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 16px 40px rgba(178,58,85,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .love-btn:active{ transform: translateY(-1px) scale(0.99); }

  .love-btn::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:999px;
    box-shadow: 0 0 0 0 rgba(232,96,122,0.5);
    animation: pulse-ring 2.6s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{ box-shadow: 0 0 0 0 rgba(232,96,122,0.45); }
    70%{ box-shadow: 0 0 0 18px rgba(232,96,122,0); }
    100%{ box-shadow: 0 0 0 0 rgba(232,96,122,0); }
  }

  /* ---------- message reveal ---------- */
  .message-wrap{
    margin-top: 2.4rem;
    max-width: 520px;
    display:flex;
    justify-content:center;
  }

  .message-card{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(1.05rem, 2.2vw, 1.4rem);
    line-height:1.55;
    color: var(--wine);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 22px;
    padding: 1.8rem 2.2rem;
    box-shadow: 0 20px 50px rgba(178,58,85,0.18);
    opacity:0;
    transform: translateY(14px) scale(0.97);
    transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .message-card.show{
    opacity:1;
    transform: translateY(0) scale(1);
  }

  footer.signature{
    position:relative;
    z-index:5;
    text-align:center;
    padding: 0 6vw 6vh;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size: 0.95rem;
    color: var(--rose-deep);
    opacity:0.75;
  }

  /* click heart burst */
  .click-heart{
    position:fixed;
    pointer-events:none;
    z-index:60;
    font-size: 22px;
    color: var(--rose);
    user-select:none;
    animation: float-up 1.2s ease-out forwards;
  }
  @keyframes float-up{
    0%{ opacity:0.95; transform: translate(-50%,-50%) scale(0.6) rotate(0deg); }
    15%{ opacity:1; transform: translate(-50%,-60%) scale(1) rotate(-8deg); }
    100%{ opacity:0; transform: translate(-50%,-160%) scale(0.85) rotate(10deg); }
  }

  @media (max-width: 480px){
    .controls{ top:16px; right:16px; }
    .icon-btn{ width:42px; height:42px; }
    .message-card{ padding: 1.4rem 1.5rem; border-radius: 18px; }
    footer.signature{ padding-bottom: 5vh; }
  }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<canvas id="hearts-canvas"></canvas>

<div class="controls">
  <button class="icon-btn" id="music-toggle" aria-label="Toggle background music" title="Toggle gentle music">
    <svg class="sound-bars" viewBox="0 0 24 24" fill="none">
      <rect x="4" y="9" width="3" height="6" rx="1.5" fill="#b23a55"/>
      <rect x="10.5" y="6" width="3" height="12" rx="1.5" fill="#b23a55"/>
      <rect x="17" y="10.5" width="3" height="3" rx="1.5" fill="#b23a55"/>
    </svg>
  </button>
</div>

<main class="stage">
  <p class="kicker">for you, always</p>
  <h1 class="hero-title">
    I Love You<br class="mobile-break">
    <span class="name">abang</span> <span class="heart">❤️</span>
  </h1>
  <p class="subtext">A little corner of the internet made just to remind you of one thing.</p>

  <div class="cta">
    <button class="love-btn" id="love-button">Click Me ❤️</button>
  </div>

  <div class="message-wrap">
    <p class="message-card" id="message-card">I love you more than words can explain. You are my favorite person. ❤️</p>
  </div>
</main>

<footer class="signature">made with love, just for you</footer>

<script>
(function(){
  "use strict";

  /* ============ Floating hearts background ============ */
  const heartsCanvas = document.getElementById('hearts-canvas');
  const hctx = heartsCanvas.getContext('2d');
  const particleCanvas = document.getElementById('particle-canvas');
  const pctx = particleCanvas.getContext('2d');

  let W = window.innerWidth, H = window.innerHeight;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    [heartsCanvas, particleCanvas].forEach(c=>{
      c.width = W * devicePixelRatio;
      c.height = H * devicePixelRatio;
      c.style.width = W + 'px';
      c.style.height = H + 'px';
    });
    hctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    pctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function drawHeartPath(ctx, x, y, size){
    ctx.beginPath();
    const topCurveHeight = size * 0.3;
    ctx.moveTo(x, y + topCurveHeight);
    ctx.bezierCurveTo(x, y, x - size/2, y, x - size/2, y + topCurveHeight);
    ctx.bezierCurveTo(x - size/2, y + (size + topCurveHeight)/2, x, y + (size + topCurveHeight)/1.4, x, y + size);
    ctx.bezierCurveTo(x, y + (size + topCurveHeight)/1.4, x + size/2, y + (size + topCurveHeight)/2, x + size/2, y + topCurveHeight);
    ctx.bezierCurveTo(x + size/2, y, x, y, x, y + topCurveHeight);
    ctx.closePath();
  }

  const heartColors = ['rgba(232,96,122,0.55)','rgba(255,182,199,0.6)','rgba(178,58,85,0.4)','rgba(255,214,224,0.7)'];

  class Heart{
    constructor(){ this.reset(true); }
    reset(initial){
      this.x = Math.random() * W;
      this.y = initial ? Math.random() * H : H + 40;
      this.size = 10 + Math.random() * 18;
      this.speed = 0.25 + Math.random() * 0.55;
      this.drift = (Math.random() - 0.5) * 0.6;
      this.angle = Math.random() * Math.PI * 2;
      this.spin = (Math.random() - 0.5) * 0.01;
      this.color = heartColors[Math.floor(Math.random()*heartColors.length)];
      this.opacity = 0.4 + Math.random() * 0.5;
      this.sway = Math.random() * Math.PI * 2;
    }
    update(){
      this.y -= this.speed;
      this.sway += 0.01;
      this.x += Math.sin(this.sway) * 0.4 + this.drift * 0.15;
      this.angle += this.spin;
      if(this.y < -40) this.reset(false);
    }
    draw(ctx){
      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.fillStyle = this.color;
      drawHeartPath(ctx, 0, -this.size/2, this.size);
      ctx.fill();
      ctx.restore();
    }
  }

  const heartCount = W < 600 ? 12 : 22;
  const hearts = Array.from({length: heartCount}, () => new Heart());

  function animateHearts(){
    hctx.clearRect(0,0,W,H);
    hearts.forEach(h=>{ h.update(); h.draw(hctx); });
    if(!prefersReduced) requestAnimationFrame(animateHearts);
  }
  animateHearts();
  if(prefersReduced){
    hctx.clearRect(0,0,W,H);
    hearts.forEach(h=>h.draw(hctx));
  }

  /* ============ Glowing particles ============ */
  class Particle{
    constructor(){ this.reset(); }
    reset(){
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.r = 0.6 + Math.random() * 1.8;
      this.baseAlpha = 0.15 + Math.random() * 0.35;
      this.tw = Math.random() * Math.PI * 2;
      this.twSpeed = 0.01 + Math.random() * 0.02;
      this.vy = -0.05 - Math.random() * 0.15;
      this.vx = (Math.random() - 0.5) * 0.08;
    }
    update(){
      this.tw += this.twSpeed;
      this.y += this.vy;
      this.x += this.vx;
      if(this.y < -10) this.reset(), this.y = H + 10;
    }
    draw(ctx){
      const alpha = this.baseAlpha * (0.5 + 0.5 * Math.sin(this.tw));
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,235,240,${alpha})`;
      ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  const particleCount = W < 600 ? 40 : 80;
  const particles = Array.from({length: particleCount}, () => new Particle());

  function animateParticles(){
    pctx.clearRect(0,0,W,H);
    particles.forEach(p=>{ p.update(); p.draw(pctx); });
    if(!prefersReduced) requestAnimationFrame(animateParticles);
  }
  animateParticles();
  if(prefersReduced){
    pctx.clearRect(0,0,W,H);
    particles.forEach(p=>p.draw(pctx));
  }

  /* ============ Click-anywhere heart burst ============ */
  function spawnClickHeart(x, y){
    const el = document.createElement('div');
    el.className = 'click-heart';
    el.textContent = ['❤️','💕','💗','💖'][Math.floor(Math.random()*4)];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 1250);
  }

  document.addEventListener('click', function(e){
    // avoid double-spawning right on top of buttons (still nice, but keep it subtle)
    spawnClickHeart(e.clientX, e.clientY);
  });

  /* ============ Love button reveal ============ */
  const loveBtn = document.getElementById('love-button');
  const messageCard = document.getElementById('message-card');
  loveBtn.addEventListener('click', function(){
    messageCard.classList.add('show');
    // little celebratory burst of hearts around the button
    const rect = loveBtn.getBoundingClientRect();
    for(let i=0;i<10;i++){
      setTimeout(()=>{
        const x = rect.left + rect.width/2 + (Math.random()-0.5)*rect.width;
        const y = rect.top + (Math.random()-0.5)*20;
        spawnClickHeart(x,y);
      }, i*60);
    }
    messageCard.scrollIntoView({behavior:'smooth', block:'nearest'});
  });

  /* ============ Gentle background music (generated, no external file) ============ */
  const musicBtn = document.getElementById('music-toggle');
  let audioCtx = null;
  let musicNodes = null;
  let playing = false;

  function startMusic(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();

    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);
    masterGain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 1.5);

    // Soft pad: a gentle arpeggio of warm sine/triangle tones
    const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; // C E G C G E - soft major
    const oscillators = [];
    const noteGains = [];

    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq / 2; // an octave down, softer
      const g = audioCtx.createGain();
      g.gain.value = 0;
      osc.connect(g);
      g.connect(masterGain);
      osc.start();
      oscillators.push(osc);
      noteGains.push(g);
    });

    let step = 0;
    const interval = setInterval(()=>{
      const now = audioCtx.currentTime;
      noteGains.forEach((g, idx) => {
        if(idx === step){
          g.gain.cancelScheduledValues(now);
          g.gain.setValueAtTime(g.gain.value, now);
          g.gain.linearRampToValueAtTime(0.5, now + 0.4);
          g.gain.linearRampToValueAtTime(0, now + 2.2);
        }
      });
      step = (step + 1) % notes.length;
    }, 900);

    // gentle sub pad drone for warmth
    const drone = audioCtx.createOscillator();
    drone.type = 'triangle';
    drone.frequency.value = 130.81;
    const droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.03;
    drone.connect(droneGain);
    droneGain.connect(masterGain);
    drone.start();

    musicNodes = { masterGain, oscillators, noteGains, interval, drone, droneGain };
  }

  function stopMusic(){
    if(!musicNodes) return;
    const now = audioCtx.currentTime;
    musicNodes.masterGain.gain.cancelScheduledValues(now);
    musicNodes.masterGain.gain.setValueAtTime(musicNodes.masterGain.gain.value, now);
    musicNodes.masterGain.gain.linearRampToValueAtTime(0, now + 0.8);
    clearInterval(musicNodes.interval);
    const nodesToStop = [...musicNodes.oscillators, musicNodes.drone];
    setTimeout(()=>{
      nodesToStop.forEach(o => { try{ o.stop(); }catch(e){} });
    }, 900);
    musicNodes = null;
  }

  musicBtn.addEventListener('click', function(){
    playing = !playing;
    musicBtn.classList.toggle('playing', playing);
    if(playing){
      startMusic();
      musicBtn.setAttribute('aria-label','Pause background music');
    } else {
      stopMusic();
      musicBtn.setAttribute('aria-label','Play background music');
    }
  });

})();
</script>
</body>
</html>
