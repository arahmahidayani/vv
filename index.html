<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Abang 🖤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ISI / TEKS BISA DIGANTI DI SINI  →  cari objek "CONTENT"
     di bagian <script> paling bawah file ini.
     ============================================================ */

  :root{
    --bg: #1a1420;
    --bg-deep: #120d17;
    --card: #241b2c;
    --cream: #f4ecdf;
    --cream-dim: #cdc0b8;
    --gold: #cf9f5f;
    --gold-soft: #e3c493;
    --rose: #b97b83;
    --line: rgba(244,236,223,0.14);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #2c2033 0%, var(--bg) 55%),
      var(--bg);
    color:var(--cream);
    font-family:'Karla', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(244,236,223,.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 65%, rgba(244,236,223,.35), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(244,236,223,.4), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(244,236,223,.3), transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, rgba(244,236,223,.4), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(244,236,223,.3), transparent),
      radial-gradient(1px 1px at 92% 75%, rgba(244,236,223,.3), transparent);
    background-repeat:repeat;
    background-size:600px 600px;
    opacity:.6;
  }

  .wrap{
    position:relative; z-index:1;
    max-width:600px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- HERO ---------- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 28px 60px;
    position:relative;
    z-index:1;
  }
  .hero .eyebrow{
    font-family:'Karla',sans-serif;
    font-size:15px;
    letter-spacing:.02em;
    color:var(--rose);
    margin-bottom:18px;
  }
  .hero .age{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(90px, 32vw, 190px);
    line-height:.85;
    color:var(--gold-soft);
    margin:0;
    text-shadow: 0 0 60px rgba(207,159,95,0.25);
  }
  .hero .headline{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(26px, 6vw, 38px);
    line-height:1.25;
    margin:22px 0 14px;
    color:var(--cream);
  }
  .hero .sub{
    font-size:16px;
    color:var(--cream-dim);
    max-width:380px;
    line-height:1.6;
  }
  .hero .from{
    margin-top:46px;
    font-size:14px;
    color:var(--cream-dim);
    letter-spacing:.01em;
  }
  .hero .from span{color:var(--rose);}

  .scroll-hint{
    margin-top:56px;
    width:1px; height:46px;
    background:linear-gradient(to bottom, var(--gold), transparent);
    position:relative;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  /* ---------- NOTE SECTIONS ---------- */
  .note{
    padding:70px 0;
    border-top:1px solid var(--line);
  }
  .note .label{
    font-size:13px;
    color:var(--rose);
    margin-bottom:16px;
    display:block;
  }
  .note p{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(19px, 4vw, 23px);
    line-height:1.65;
    color:var(--cream);
    margin:0 0 16px;
  }
  .note p:last-child{margin-bottom:0;}
  .note p em{
    font-style:italic;
    color:var(--gold-soft);
  }

  /* ---------- CANDLE / REVEAL INTERACTION ---------- */
  .candle-section{
    padding:90px 0 100px;
    text-align:center;
    border-top:1px solid var(--line);
  }
  .candle-section .label{
    font-size:13px;
    color:var(--rose);
    display:block;
    margin-bottom:10px;
  }
  .candle-section h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(22px,5vw,28px);
    margin:0 0 40px;
    color:var(--cream);
  }

  .candle-wrap{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    user-select:none;
    background:none;
    border:none;
    padding:0;
    font:inherit;
  }
  .candle-wrap:focus-visible{ outline:2px solid var(--gold); outline-offset:8px; border-radius:8px; }

  .flame{
    width:14px; height:22px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #fff2c9 0%, var(--gold) 45%, #a85f2e 100%);
    margin-bottom:-2px;
    transform-origin:bottom center;
    animation:flicker 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 12px rgba(207,159,95,.8));
  }
  @keyframes flicker{
    0%,100%{ transform:scale(1) rotate(-1deg); }
    50%{ transform:scale(1.08,0.95) rotate(2deg); }
  }
  .candle-body{
    width:20px; height:70px;
    background:linear-gradient(to right, #6b5142, #8a6a55, #6b5142);
    border-radius:3px;
  }
  .candle-caption{
    margin-top:22px;
    font-size:14px;
    color:var(--cream-dim);
  }
  .candle-wrap.blown .flame{ opacity:0; transform:scale(0); }
  .candle-wrap.blown .candle-caption{ opacity:0; }

  .smoke{
    width:2px; height:0px;
    background:rgba(230,225,220,.5);
    margin:0 auto;
    opacity:0;
  }
  .candle-wrap.blown .smoke{
    animation:smoke-rise 1.4s ease-out forwards;
  }
  @keyframes smoke-rise{
    0%{ height:0px; opacity:.6; transform:translateX(0) scaleX(1); }
    100%{ height:60px; opacity:0; transform:translateX(8px) scaleX(3); }
  }

  /* ---------- LETTER (final message) ---------- */
  .letter-section{
    padding:20px 0 110px;
  }
  .letter{
    background:linear-gradient(180deg, var(--card), #1e1626);
    border:1px solid var(--line);
    border-radius:2px;
    padding:44px 34px;
    position:relative;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity 1.1s ease, max-height 1.4s ease;
  }
  .letter.show{
    opacity:1;
    max-height:2000px;
  }
  .letter::before{
    content:'';
    position:absolute;
    top:0; left:34px; right:34px;
    height:1px;
    background:linear-gradient(to right, transparent, var(--gold), transparent);
  }
  .letter .to{
    font-size:13px;
    color:var(--rose);
    margin-bottom:22px;
    display:block;
  }
  .letter h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(24px, 5.5vw, 30px);
    color:var(--gold-soft);
    margin:0 0 26px;
    line-height:1.3;
  }
  .letter p{
    font-family:'Fraunces', serif;
    font-size:clamp(16.5px, 3.6vw, 18px);
    line-height:1.85;
    color:var(--cream);
    margin:0 0 18px;
  }
  .letter p:last-of-type{margin-bottom:0;}
  .letter .sign{
    margin-top:30px;
    font-style:italic;
    color:var(--gold-soft);
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:50px 28px 70px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--cream-dim);
    letter-spacing:.02em;
  }
  footer .heart{
    color:var(--rose);
    display:block;
    margin-bottom:10px;
    font-size:20px;
  }

  @media (prefers-reduced-motion: reduce){
    .flame, .scroll-hint{ animation:none; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<div class="wrap">

  <section class="hero">
    <span class="eyebrow" data-c="heroEyebrow"></span>
    <p class="age" data-c="heroAge"></p>
    <h1 class="headline" data-c="heroHeadline"></h1>
    <p class="sub" data-c="heroSub"></p>
    <p class="from" data-c="heroFrom"></p>
    <div class="scroll-hint"></div>
  </section>

  <section class="note">
    <span class="label" data-c="note1Label"></span>
    <div data-c-html="note1Body"></div>
  </section>

  <section class="note">
    <span class="label" data-c="note2Label"></span>
    <div data-c-html="note2Body"></div>
  </section>

  <section class="candle-section">
    <span class="label" data-c="candleLabel"></span>
    <h3 data-c="candleHeadline"></h3>
    <button class="candle-wrap" id="candleBtn" aria-label="Tiup lilinnya untuk membuka pesan">
      <div class="flame"></div>
      <div class="candle-body"></div>
      <div class="smoke"></div>
      <p class="candle-caption" data-c="candleCaption"></p>
    </button>
  </section>

  <section class="letter-section">
    <div class="letter" id="letterBox">
      <span class="to" data-c="letterTo"></span>
      <h2 data-c="letterTitle"></h2>
      <div data-c-html="letterBody"></div>
      <p class="sign" data-c="letterSign"></p>
    </div>
  </section>

  <footer>
    <span class="heart">🤍</span>
    <span data-c="footer"></span>
  </footer>

</div>

<script>
/* ============================================================
   SEMUA TEKS DI WEBSITE INI ADA DI SINI.
   Ganti isinya sesuka hati — nggak perlu ubah bagian lain.
   Boleh pakai tag <br> untuk ganti baris, dan <em>...</em>
   untuk bikin kata jadi miring.
   ============================================================ */
const CONTENT = {

  // ===== HERO (bagian paling atas) =====
  heroEyebrow: "untuk abang, dari aku",
  heroAge: "24",
  heroHeadline: "Selamat ulang tahun, sayang. 🖤",
  heroSub: "Scroll pelan-pelan ya, abang. Ada beberapa hal yang mau aku bilang.",
  heroFrom: "dengan sayang, <span>aku</span>",

  // ===== NOTE 1 =====
  note1Label: "buat abang",
  note1Body: `
    <p>Selamat ulang tahun, abang. 🖤 Nggak kerasa ya, sekarang abang udah 24 tahun.</p>
    <p>Aku nggak pinter bikin kata-kata yang manis-manis, tapi aku mau abang tau, aku beneran bahagia bisa ngerayain hari ini buat kamu.</p>
  `,

  // ===== NOTE 2 =====
  note2Label: "sedikit cerita",
  note2Body: `
    <p>Di umur abang yang ke-<em>24</em> ini, aku cuma mau bilang, makasih ya sudah hadir di hidup aku.</p>
    <p>Aku mungkin nggak selalu bilang, tapi aku sayang banget sama kamu.</p>
  `,

  // ===== BAGIAN LILIN (interaktif) =====
  candleLabel: "sebelum lanjut",
  candleHeadline: "Tiup lilinnya dulu, abang.",
  candleCaption: "(tap lilinnya)",

  // ===== SURAT / PESAN UTAMA =====
  letterTo: "untuk abang sayang",
  letterTitle: "Selamat ulang tahun yang ke-24, abang sayang. 🖤",
  letterBody: `
    <p>Nggak kerasa ya, sekarang abang udah 24 tahun. Semoga di umur yang baru ini, abang selalu dikasih kesehatan, dimudahkan semua urusannya, dan satu per satu hal yang abang impikan bisa tercapai.</p>
    <p>Aku mungkin nggak selalu bisa jadi orang yang paling sempurna buat abang, tapi aku selalu berharap yang terbaik buat kamu.</p>
    <p>Makasih ya, sayang, untuk semua cerita, semua tawa, semua waktu, dan semua hal kecil yang pernah kita lewati.</p>
    <p>Semoga nanti kita punya lebih banyak cerita lagi.</p>
    <p>Sekali lagi, selamat ulang tahun, abang. 🤍</p>
  `,
  letterSign: "I love you.",

  // ===== FOOTER =====
  footer: "dibikin khusus buat abang, sama sayangnya aku.",
};

// --- render semua teks dari CONTENT ke halaman ---
document.querySelectorAll('[data-c]').forEach(el=>{
  const key = el.getAttribute('data-c');
  if(CONTENT[key] !== undefined) el.innerHTML = CONTENT[key];
});
document.querySelectorAll('[data-c-html]').forEach(el=>{
  const key = el.getAttribute('data-c-html');
  if(CONTENT[key] !== undefined) el.innerHTML = CONTENT[key];
});

// --- interaksi lilin: tiup lilin -> pesan muncul ---
const candleBtn = document.getElementById('candleBtn');
const letterBox = document.getElementById('letterBox');
candleBtn.addEventListener('click', ()=>{
  if(candleBtn.classList.contains('blown')) return;
  candleBtn.classList.add('blown');
  setTimeout(()=>{
    letterBox.classList.add('show');
    letterBox.scrollIntoView({behavior:'smooth', block:'center'});
  }, 500);
});
</script>

</body>
</html>
