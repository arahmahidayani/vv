<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ISI / TEKS BISA DIGANTI DI SINI  →  cari objek "CONTENT"
     di bagian <script> paling bawah file ini.

     MUSIK: taruh file mp3 kamu di folder yang sama dengan file
     ini, kasih nama "bg_music.mp3" (atau ganti nama di tag
     <audio> di bawah). Browser tidak mengizinkan musik
     otomatis menyala sebelum ada sentuhan/klik dari pengguna —
     karena itu halaman ini dibuka dengan layar "tekan untuk
     membuka" yang sekaligus langsung menyalakan musik di
     sentuhan pertama, jadi tetap terasa "langsung ada musik"
     tanpa perlu klik tombol musik terpisah.
     ============================================================ */

  :root{
    --bg: #08070a;
    --bg-deep: #030203;
    --card: #171209;
    --cream: #f6ecd9;
    --cream-dim: #c9bfae;
    --gold: #cf9f52;
    --gold-bright: #f3ce87;
    --gold-deep: #7a5a26;
    --line: rgba(243,206,135,0.16);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 520px at 50% -8%, rgba(243,206,135,0.16) 0%, transparent 60%),
      radial-gradient(ellipse 700px 420px at 88% 102%, rgba(207,159,82,0.10) 0%, transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:'Karla', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(243,206,135,.45), transparent),
      radial-gradient(1.5px 1.5px at 70% 65%, rgba(243,206,135,.3), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(243,206,135,.35), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(243,206,135,.25), transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, rgba(243,206,135,.35), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(243,206,135,.25), transparent),
      radial-gradient(1px 1px at 92% 75%, rgba(243,206,135,.25), transparent);
    background-repeat:repeat;
    background-size:600px 600px;
    opacity:.6;
  }

  /* ---------- floating sparkles (ambient layer) ---------- */
  .floaties{
    position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;
  }
  .floaty{
    position:absolute;
    bottom:-40px;
    font-size:16px;
    opacity:0;
    animation: floatUp linear infinite;
    filter:drop-shadow(0 0 6px rgba(207,159,82,.3));
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.55; }
    50%{ transform:translateY(-52vh) translateX(14px) rotate(8deg); }
    90%{ opacity:.35; }
    100%{ transform:translateY(-102vh) translateX(-10px) rotate(-6deg); opacity:0; }
  }

  .wrap{
    position:relative; z-index:2;
    max-width:600px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- INTRO OVERLAY (tap untuk buka + nyalain musik) ---------- */
  .intro-overlay{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 700px 500px at 50% 40%, rgba(243,206,135,0.10) 0%, transparent 65%),
      var(--bg-deep);
    text-align:center;
    cursor:pointer;
    transition:opacity .8s ease, visibility .8s ease;
  }
  .intro-overlay.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .intro-inner{ padding:0 32px; position:relative; }
  .intro-sparkles{
    position:absolute;
    inset:-60px -40px;
    pointer-events:none;
    z-index:0;
  }
  .intro-sparkle{
    position:absolute;
    color:var(--gold-bright);
    font-size:14px;
    opacity:0;
    animation: sparkleTwinkle 3.2s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(243,206,135,.6));
  }
  .intro-label{
    font-size:13px;
    letter-spacing:.02em;
    color:var(--gold);
    margin:0 0 18px;
    position:relative;
    z-index:1;
  }
  .intro-title{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(24px, 6vw, 32px);
    color:var(--gold-bright);
    margin:0 0 34px;
    text-shadow:0 0 40px rgba(243,206,135,.3);
    position:relative;
    z-index:1;
  }

  /* ---------- AMPLOP INTERAKTIF DI LAYAR PEMBUKA ---------- */
  .envelope-wrap{
    margin:0 auto 30px;
    width:104px;
    cursor:pointer;
    position:relative;
    z-index:1;
  }
  .envelope-wrap:focus-visible .envelope-body{ outline:2px solid var(--gold); outline-offset:4px; }
  .envelope-scene{
    position:relative;
    width:104px;
    height:70px;
    margin:0 auto;
    perspective:600px;
    animation: breathe 3.4s ease-in-out infinite;
  }
  .envelope-letter{
    position:absolute;
    left:12px; right:12px; top:-6px;
    height:52px;
    background:linear-gradient(180deg,#faf3e2,#f0e4c8);
    border-radius:2px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    transform:translateY(8px);
    transition:transform .7s cubic-bezier(.34,1.56,.64,1);
    z-index:1;
  }
  .envelope-body{
    position:absolute;
    left:0; right:0; bottom:0; top:14px;
    background:linear-gradient(160deg,#1f1710,#120d08);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 12px 28px rgba(0,0,0,.5);
    z-index:3;
  }
  .envelope-seal{
    position:absolute; left:50%; top:60%;
    transform:translate(-50%,-50%);
    font-size:15px;
    filter:drop-shadow(0 0 6px rgba(243,206,135,.55));
    z-index:5;
    transition:opacity .3s ease;
  }
  .envelope-flap{
    position:absolute;
    left:0; top:14px; width:100%; height:0;
    border-left:52px solid transparent;
    border-right:52px solid transparent;
    border-top:34px solid #241c12;
    transform-origin:top center;
    transition:transform .65s cubic-bezier(.34,1.56,.64,1);
    z-index:4;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.35));
  }
  .envelope-wrap.opening .envelope-flap{ transform:rotateX(150deg); }
  .envelope-wrap.opening .envelope-letter{ transform:translateY(-34px); }
  .envelope-wrap.opening .envelope-seal{ opacity:0; }
  .envelope-hint{
    margin-top:16px;
    font-size:12px;
    color:var(--cream-dim);
    letter-spacing:.02em;
  }
  .intro-btn{
    border:1px solid var(--line);
    background:rgba(243,206,135,0.06);
    color:var(--cream);
    font-family:'Karla', sans-serif;
    font-size:14px;
    letter-spacing:.02em;
    padding:14px 30px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .25s ease, background .25s ease, border-color .25s ease;
  }
  .intro-btn:hover{ transform:translateY(-2px); border-color:var(--gold); background:rgba(243,206,135,0.12); }

  /* ---------- HERO ---------- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 28px 40px;
    position:relative;
    z-index:1;
  }
  .hero .eyebrow{
    font-family:'Karla',sans-serif;
    font-size:15px;
    letter-spacing:.02em;
    color:var(--gold);
    margin-bottom:18px;
  }
  .hero .age{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(90px, 32vw, 190px);
    line-height:.85;
    margin:0;
    background:linear-gradient(105deg,
      var(--gold-deep) 0%, var(--gold) 22%, #fff2c9 42%,
      var(--gold-bright) 58%, var(--gold-deep) 78%, var(--gold) 100%);
    background-size:280% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:
      goldShimmer 5.5s linear infinite,
      goldFlicker 3.4s ease-in-out infinite;
  }
  @keyframes goldShimmer{
    0%{ background-position:0% 50%; }
    100%{ background-position:280% 50%; }
  }
  /* langkah-langkah tidak rata biar kelap-kelipnya terasa hidup, bukan mesin */
  @keyframes goldFlicker{
    0%{   filter:brightness(1)    drop-shadow(0 0 34px rgba(243,206,135,0.30)) drop-shadow(0 0 80px rgba(207,159,82,0.15)); }
    6%{   filter:brightness(1.12) drop-shadow(0 0 50px rgba(243,206,135,0.48)) drop-shadow(0 0 100px rgba(207,159,82,0.24)); }
    14%{  filter:brightness(0.95) drop-shadow(0 0 30px rgba(243,206,135,0.26)) drop-shadow(0 0 70px rgba(207,159,82,0.13)); }
    22%{  filter:brightness(1.08) drop-shadow(0 0 46px rgba(243,206,135,0.42)) drop-shadow(0 0 96px rgba(207,159,82,0.22)); }
    33%{  filter:brightness(1)    drop-shadow(0 0 38px rgba(243,206,135,0.32)) drop-shadow(0 0 84px rgba(207,159,82,0.17)); }
    47%{  filter:brightness(1.16) drop-shadow(0 0 58px rgba(243,206,135,0.55)) drop-shadow(0 0 116px rgba(207,159,82,0.3)); }
    58%{  filter:brightness(0.97) drop-shadow(0 0 32px rgba(243,206,135,0.28)) drop-shadow(0 0 76px rgba(207,159,82,0.14)); }
    70%{  filter:brightness(1.1)  drop-shadow(0 0 48px rgba(243,206,135,0.44)) drop-shadow(0 0 98px rgba(207,159,82,0.23)); }
    84%{  filter:brightness(1)    drop-shadow(0 0 36px rgba(243,206,135,0.3))  drop-shadow(0 0 82px rgba(207,159,82,0.16)); }
    92%{  filter:brightness(1.14) drop-shadow(0 0 54px rgba(243,206,135,0.5))  drop-shadow(0 0 108px rgba(207,159,82,0.27)); }
    100%{ filter:brightness(1)    drop-shadow(0 0 34px rgba(243,206,135,0.30)) drop-shadow(0 0 80px rgba(207,159,82,0.15)); }
  }
  /* ---------- HIASAN DI ATAS ANGKA UMUR (lilin kecil + kelip bintang) ---------- */
  .age-wrap{
    position:relative;
    display:inline-block;
  }
  .age-candles{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-bottom:-6px;
    position:relative;
    z-index:2;
  }
  .mini-candle{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .mini-flame{
    width:7px; height:11px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #fff2c9 0%, var(--gold) 45%, #7a4a1e 100%);
    margin-bottom:-1px;
    transform-origin:bottom center;
    filter:drop-shadow(0 0 8px rgba(243,206,135,.85));
    animation:flicker 1.4s ease-in-out infinite;
  }
  .mini-candle:nth-child(2) .mini-flame{ animation-delay:.35s; }
  .mini-stick{
    width:9px; height:30px;
    background:linear-gradient(to right, #2a2118, #4a3b28, #2a2118);
    border-radius:2px;
  }
  .age-sparkles{
    position:absolute;
    inset:-18px -28px;
    pointer-events:none;
    z-index:1;
  }
  .age-sparkle{
    position:absolute;
    color:var(--gold-bright);
    font-size:13px;
    opacity:0;
    animation: sparkleTwinkle 2.8s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(243,206,135,.6));
  }
  @keyframes sparkleTwinkle{
    0%,100%{ opacity:0; transform:scale(.4) rotate(0deg); }
    50%{ opacity:1; transform:scale(1) rotate(14deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .mini-flame, .age-sparkle{ animation:none !important; opacity:.7; }
  }

  .hero .headline{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(26px, 6vw, 38px);
    line-height:1.25;
    margin:22px 0 14px;
    color:var(--cream);
  }
  .hero .sub{
    font-size:16px;
    color:var(--cream-dim);
    max-width:380px;
    line-height:1.6;
  }
  .hero .from{
    margin-top:36px;
    font-size:14px;
    color:var(--cream-dim);
    letter-spacing:.01em;
  }
  .hero .from span{color:var(--gold-bright);}

  /* ---------- CUTE MASCOT ---------- */
  .mascot-holder{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .mascot-glow{
    position:absolute;
    top:0; left:50%;
    transform:translate(-50%,-6%);
    width:130px; height:130px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(243,206,135,.22) 0%, transparent 70%);
    animation: glowPulse 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.4; transform:translate(-50%,-6%) scale(.92); }
    50%{ opacity:.85; transform:translate(-50%,-6%) scale(1.08); }
  }
  .mascot{
    width:108px; height:108px;
    animation: breathe 3.4s ease-in-out infinite, nudge 6s ease-in-out infinite;
    transform-origin:50% 85%;
    cursor:pointer;
    position:relative;
    z-index:1;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1,1) translateY(0); }
    50%{ transform:scale(1.035,0.965) translateY(-3px); }
  }
  @keyframes nudge{
    0%, 82%, 100%{ transform:rotate(0deg); }
    85%{ transform:rotate(-6deg); }
    88%{ transform:rotate(5deg); }
    91%{ transform:rotate(-4deg); }
    94%{ transform:rotate(0deg); }
  }
  .mascot .eye{ transition:transform .12s ease; transform-origin:center; }
  .mascot.blink .eye{ transform:scaleY(0.12); }
  .mascot.jump{ animation: jumpHappy 0.9s ease; }
  @keyframes jumpHappy{
    0%{ transform:translateY(0) scale(1,1); }
    25%{ transform:translateY(-22px) scale(0.96,1.08); }
    45%{ transform:translateY(-26px) scale(1.04,0.94); }
    65%{ transform:translateY(0) scale(0.94,1.08); }
    85%{ transform:translateY(-6px) scale(1.02,0.98); }
    100%{ transform:translateY(0) scale(1,1); }
  }
  .tap-hint{
    margin-top:10px;
    font-size:12px;
    color:var(--gold);
    letter-spacing:.02em;
    opacity:0;
    animation: hintFade 2.6s ease-in-out infinite;
    transition:opacity .4s ease;
  }
  @keyframes hintFade{
    0%,100%{ opacity:.15; }
    50%{ opacity:.85; }
  }
  .mascot-holder.tapped .tap-hint{
    animation:none;
    opacity:0;
  }

  /* --- balon obrolan random pas maskot diklik --- */
  .mascot-bubble{
    position:absolute;
    top:-6px; left:50%;
    transform:translateX(-50%);
    background:var(--gold-bright);
    color:#241c12;
    padding:7px 14px;
    border-radius:14px;
    font-family:'Karla', sans-serif;
    font-size:12.5px;
    font-weight:500;
    white-space:nowrap;
    pointer-events:none;
    box-shadow:0 4px 16px rgba(0,0,0,.35);
    animation: bubblePop 1.6s ease forwards;
  }
  .mascot-bubble::after{
    content:'';
    position:absolute;
    bottom:-6px; left:50%;
    transform:translateX(-50%);
    border-width:6px 6px 0 6px;
    border-style:solid;
    border-color:var(--gold-bright) transparent transparent transparent;
  }
  @keyframes bubblePop{
    0%{ opacity:0; transform:translateX(-50%) translateY(8px) scale(.9); }
    15%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    82%{ opacity:1; }
    100%{ opacity:0; transform:translateX(-50%) translateY(-12px) scale(.96); }
  }

  .scroll-hint{
    margin-top:38px;
    width:1px; height:46px;
    background:linear-gradient(to bottom, var(--gold), transparent);
    position:relative;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  /* ---------- NOTE SECTIONS ---------- */
  .note{
    padding:70px 0;
    border-top:1px solid var(--line);
    position:relative;
    z-index:1;
  }
  .note .label{
    font-size:13px;
    color:var(--gold);
    margin-bottom:16px;
    display:block;
  }
  .note p{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(19px, 4vw, 23px);
    line-height:1.65;
    color:var(--cream);
    margin:0 0 16px;
  }
  .note p:last-child{margin-bottom:0;}
  .note p em{
    font-style:italic;
    color:var(--gold-bright);
  }

  /* ---------- CANDLE / REVEAL INTERACTION ---------- */
  .candle-section{
    padding:90px 0 100px;
    text-align:center;
    border-top:1px solid var(--line);
    position:relative;
    z-index:1;
  }
  .candle-section .label{
    font-size:13px;
    color:var(--gold);
    display:block;
    margin-bottom:10px;
  }
  .candle-section h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(22px,5vw,28px);
    margin:0 0 40px;
    color:var(--cream);
  }

  .candle-wrap{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    user-select:none;
    background:none;
    border:none;
    padding:0;
    font:inherit;
  }
  .candle-wrap:focus-visible{ outline:2px solid var(--gold); outline-offset:8px; border-radius:8px; }

  .flame{
    width:14px; height:22px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #fff2c9 0%, var(--gold) 45%, #7a4a1e 100%);
    margin-bottom:-2px;
    transform-origin:bottom center;
    animation:flicker 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(243,206,135,.9));
  }
  @keyframes flicker{
    0%,100%{ transform:scale(1) rotate(-1deg); }
    50%{ transform:scale(1.08,0.95) rotate(2deg); }
  }
  .candle-body{
    width:20px; height:70px;
    background:linear-gradient(to right, #2a2118, #4a3b28, #2a2118);
    border-radius:3px;
  }
  .candle-caption{
    margin-top:22px;
    font-size:14px;
    color:var(--cream-dim);
  }
  .candle-wrap.blown .flame{ opacity:0; transform:scale(0); }
  .candle-wrap.blown .candle-caption{ opacity:0; }

  .smoke{
    width:2px; height:0px;
    background:rgba(230,225,220,.5);
    margin:0 auto;
    opacity:0;
  }
  .candle-wrap.blown .smoke{
    animation:smoke-rise 1.4s ease-out forwards;
  }
  @keyframes smoke-rise{
    0%{ height:0px; opacity:.6; transform:translateX(0) scaleX(1); }
    100%{ height:60px; opacity:0; transform:translateX(8px) scaleX(3); }
  }

  /* ---------- LETTER (final message) ---------- */
  .letter-section{
    padding:20px 0 110px;
    position:relative;
    z-index:1;
  }
  .letter{
    background:linear-gradient(180deg, var(--card), #100c07);
    border:1px solid var(--line);
    border-radius:2px;
    padding:44px 34px;
    position:relative;
    opacity:0;
    max-height:0;
    overflow:hidden;
    box-shadow:0 0 0 rgba(243,206,135,0);
    transition:opacity 1.1s ease, max-height 1.4s ease, box-shadow 1.4s ease;
  }
  .letter.show{
    opacity:1;
    max-height:2000px;
    box-shadow:0 0 60px rgba(207,159,82,0.08);
  }
  .letter::before{
    content:'';
    position:absolute;
    top:0; left:34px; right:34px;
    height:1px;
    background:linear-gradient(to right, transparent, var(--gold), transparent);
  }
  .letter .to{
    font-size:13px;
    color:var(--gold);
    margin-bottom:22px;
    display:block;
  }
  .letter h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(24px, 5.5vw, 30px);
    color:var(--gold-bright);
    margin:0 0 26px;
    line-height:1.3;
  }
  .letter p{
    font-family:'Fraunces', serif;
    font-size:clamp(16.5px, 3.6vw, 18px);
    line-height:1.85;
    color:var(--cream);
    margin:0 0 18px;
  }
  .letter p:last-of-type{margin-bottom:0;}
  .letter .sign{
    margin-top:30px;
    font-style:italic;
    color:var(--gold-bright);
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:50px 28px 70px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--cream-dim);
    letter-spacing:.02em;
    position:relative;
    z-index:1;
  }
  footer .heart{
    color:var(--gold);
    display:block;
    margin-bottom:10px;
    font-size:20px;
  }

  /* ---------- MUSIC TOGGLE ---------- */
  .music-toggle{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:5;
    display:flex;
    align-items:center;
    gap:9px;
    background:rgba(23,18,9,0.88);
    border:1px solid var(--line);
    color:var(--cream);
    font-family:'Karla',sans-serif;
    font-size:13px;
    padding:10px 16px 10px 12px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 22px rgba(0,0,0,.45);
    transition:transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .music-toggle:hover{ transform:translateY(-2px); border-color:var(--gold); }
  .music-toggle:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .note-icon{
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }
  .music-toggle.playing .note-icon{ animation: noteBob 1s ease-in-out infinite; }
  @keyframes noteBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3px) rotate(-8deg); }
  }
  .music-bars{ display:flex; align-items:flex-end; gap:2px; height:12px; }
  .music-bars span{
    width:2.5px; background:var(--gold-bright); border-radius:2px; height:4px;
    animation:none;
  }
  .music-toggle.playing .music-bars span{ animation:bar 0.9s ease-in-out infinite; }
  .music-bars span:nth-child(1){ animation-delay:0s; }
  .music-bars span:nth-child(2){ animation-delay:.15s; }
  .music-bars span:nth-child(3){ animation-delay:.3s; }
  @keyframes bar{
    0%,100%{ height:4px; }
    50%{ height:12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .flame, .scroll-hint, .mascot, .floaty, .music-toggle.playing .note-icon, .music-bars span, .hero .age, .mascot-bubble, .intro-sparkle, .envelope-scene, .mascot-glow, .tap-hint{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="floaties" id="floaties"></div>

<audio id="bgMusic" src="bg_music.mp3" loop preload="auto"></audio>

<div class="intro-overlay" id="introOverlay">
  <div class="intro-inner">
    <div class="intro-sparkles" id="introSparkles"></div>
    <p class="intro-label" data-c="introLabel"></p>
    <p class="intro-title" data-c="introTitle"></p>

    <div class="envelope-wrap" id="envelopeBtn" role="button" tabindex="0" aria-label="Buka amplopnya">
      <div class="envelope-scene">
        <div class="envelope-letter"></div>
        <div class="envelope-body">
          <span class="envelope-seal">🖤</span>
        </div>
        <div class="envelope-flap"></div>
      </div>
    </div>
    <p class="envelope-hint" data-c="introBtn"></p>
  </div>
</div>

<button class="music-toggle" id="musicToggle" aria-pressed="false">
  <span class="note-icon">🎵</span>
  <span class="music-bars"><span></span><span></span><span></span></span>
  <span id="musicLabel" data-c="musicOff"></span>
</button>

<div class="wrap">

  <section class="hero">
    <span class="eyebrow" data-c="heroEyebrow"></span>
    <div class="age-wrap">
      <div class="age-candles">
        <div class="mini-candle"><div class="mini-flame"></div><div class="mini-stick"></div></div>
        <div class="mini-candle"><div class="mini-flame"></div><div class="mini-stick"></div></div>
      </div>
      <p class="age" data-c="heroAge"></p>
      <div class="age-sparkles" id="ageSparkles"></div>
    </div>
    <h1 class="headline" data-c="heroHeadline"></h1>
    <p class="sub" data-c="heroSub"></p>

    <div class="mascot-holder" id="mascotHolder">
      <div class="mascot-glow"></div>
      <svg class="mascot" id="mascot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="60" cy="108" rx="30" ry="6" fill="#000" opacity="0.25"/>
        <path d="M60 20c26 0 42 18 42 44s-18 46-42 46-42-20-42-46S34 20 60 20z" fill="#f4ecd9"/>
        <ellipse cx="30" cy="70" rx="9" ry="7" fill="#f8f0e0"/>
        <ellipse cx="90" cy="70" rx="9" ry="7" fill="#f8f0e0"/>
        <circle cx="42" cy="70" r="6" fill="#e3bd7e" opacity="0.65"/>
        <circle cx="78" cy="70" r="6" fill="#e3bd7e" opacity="0.65"/>
        <g class="eye">
          <ellipse cx="47" cy="60" rx="4.2" ry="5.4" fill="#241c12"/>
          <circle cx="48.4" cy="57.8" r="1.3" fill="#fff"/>
        </g>
        <g class="eye">
          <ellipse cx="73" cy="60" rx="4.2" ry="5.4" fill="#241c12"/>
          <circle cx="74.4" cy="57.8" r="1.3" fill="#fff"/>
        </g>
        <path d="M53 74q7 6 14 0" stroke="#241c12" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M46 34c4-8 24-8 28 0" stroke="#cf9f52" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M55 30l5-9 5 9z" fill="#cf9f52"/>
      </svg>
      <span class="tap-hint">ketuk aku</span>
    </div>

    <p class="from" data-c="heroFrom"></p>
    <div class="scroll-hint"></div>
  </section>

  <section class="note">
    <span class="label" data-c="note1Label"></span>
    <div data-c-html="note1Body"></div>
  </section>

  <section class="note">
    <span class="label" data-c="note2Label"></span>
    <div data-c-html="note2Body"></div>
  </section>

  <section class="candle-section">
    <span class="label" data-c="candleLabel"></span>
    <h3 data-c="candleHeadline"></h3>
    <button class="candle-wrap" id="candleBtn" aria-label="Tiup lilinnya untuk membuka pesan">
      <div class="flame"></div>
      <div class="candle-body"></div>
      <div class="smoke"></div>
      <p class="candle-caption" data-c="candleCaption"></p>
    </button>
  </section>

  <section class="letter-section">
    <div class="letter" id="letterBox">
      <span class="to" data-c="letterTo"></span>
      <h2 data-c="letterTitle"></h2>
      <div data-c-html="letterBody"></div>
      <p class="sign" data-c="letterSign"></p>
    </div>
  </section>

  <footer>
    <span class="heart">🖤</span>
    <span data-c="footer"></span>
  </footer>

</div>

<script>
/* ============================================================
   SEMUA TEKS DI WEBSITE INI ADA DI SINI.
   Ganti isinya sesuka hati — nggak perlu ubah bagian lain.
   Boleh pakai tag <br> untuk ganti baris, dan <em>...</em>
   untuk bikin kata jadi miring.
   ============================================================ */
const CONTENT = {

  // ===== LAYAR PEMBUKA (tap untuk masuk + nyalain musik) =====
  introTitle: "klik.",
  introBtn: "tekan amplopnya untuk membuka",

  // ===== HERO (bagian paling atas) =====
  heroAge: "24",
  heroHeadline: "Happy Birthday, Sayang.",
  heroSub: "Pelan-pelan aja scrollnya.",

  // ===== NOTE 1 =====
  note1Body: `
    <p>Selamat ulang tahun, abang.</p>
  `,

  // ===== NOTE 2 =====
  note2Body: `
    <p>Di umur yang baru ini, aku cuma ingin bilang terima kasih sudah bertahan sejauh ini.</p>
    <p>Tidak semua hal perlu diucapkan setiap hari untuk terasa nyata, tapi aku bangga banget sama abang, <em>lebih</em> dari yang biasa aku tunjukkan.</p>
  `,

  // ===== BAGIAN LILIN (interaktif) =====
  candleLabel: "sebelum lanjut",
  candleHeadline: "Tiup lilinnya dulu, ay.",
  candleCaption: "(tekan lilinnya)",

  // ===== SURAT / PESAN UTAMA =====
  letterTo: "Dibaca ya abang",
  letterTitle: "Selamat ulang tahun abang sayang.",
  letterBody: `
    <p>Semoga di usia yang baru ini, abang selalu sehat, urusannya dimudahkan, dan pelan-pelan semua yang diimpikan bisa tercapai.</p>
    <p>Aamiin</p>
    <p>Aku mungkin belum jadi yang paling sempurna buat abang, tapi aku selalu berusaha memberi yang terbaik.</p>
    <p>Terima kasih untuk waktunya selama ini.</p>
    <p>Semoga masih ada banyak cerita lain yang menanti kita.</p>
    <p>Sekali lagi, selamat ulang tahun, sayanng.</p>
  `,
  letterSign: "I love you.",

  // ===== FOOTER =====
  footer: "selamat ulang tahun sayang.",

  // ===== MUSIK =====
  musicOff: "putar musik",
  musicOn: "sedang diputar",

  // ===== BALON KATA MASKOT (klik maskotnya, gantian munculnya) =====
  mascotReplies: [
    "hehe kaget ga",
    "iya iya aku tau abang ganteng",
    "udah ih jangan diklik² mulu",
    "abang mau apa sih",
    "aku sayang abang lho",
  ],
};

// --- render semua teks dari CONTENT ke halaman ---
document.querySelectorAll('[data-c]').forEach(el=>{
  const key = el.getAttribute('data-c');
  if(CONTENT[key] !== undefined) el.innerHTML = CONTENT[key];
});
document.querySelectorAll('[data-c-html]').forEach(el=>{
  const key = el.getAttribute('data-c-html');
  if(CONTENT[key] !== undefined) el.innerHTML = CONTENT[key];
});

// --- interaksi lilin: tiup lilin -> pesan muncul + maskotnya loncat seneng ---
const candleBtn = document.getElementById('candleBtn');
const letterBox = document.getElementById('letterBox');
const mascot = document.getElementById('mascot');
const mascotHolder = document.getElementById('mascotHolder');
candleBtn.addEventListener('click', ()=>{
  if(candleBtn.classList.contains('blown')) return;
  candleBtn.classList.add('blown');
  mascot.classList.add('jump');
  setTimeout(()=> mascot.classList.remove('jump'), 950);
  setTimeout(()=>{
    letterBox.classList.add('show');
    letterBox.scrollIntoView({behavior:'smooth', block:'center'});
  }, 500);
});

// --- maskot: kedip pelan-pelan tiap beberapa detik, loncat + ngomong kalau di-tap ---
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduceMotion){
  setInterval(()=>{
    mascot.classList.add('blink');
    setTimeout(()=> mascot.classList.remove('blink'), 160);
  }, 2600 + Math.random()*1400);
}

let mascotClickCount = 0;
mascot.addEventListener('click', ()=>{
  mascot.classList.add('jump');
  setTimeout(()=> mascot.classList.remove('jump'), 950);
  mascotHolder.classList.add('tapped');

  // balon kata gantian tiap diklik biar ga berasa mesin
  const replies = CONTENT.mascotReplies;
  const bubble = document.createElement('div');
  bubble.className = 'mascot-bubble';
  bubble.textContent = replies[mascotClickCount % replies.length];
  mascotHolder.appendChild(bubble);
  setTimeout(()=> bubble.remove(), 1600);
  mascotClickCount++;
});

// --- kelip bintang kecil di sekitar angka umur ---
if(!reduceMotion){
  const ageSparkles = document.getElementById('ageSparkles');
  const sparkleGlyphs = ['✦','✧','·'];
  const sparklePositions = [
    {top:'4%', left:'2%'}, {top:'12%', left:'92%'},
    {top:'78%', left:'0%'}, {top:'85%', left:'96%'},
    {top:'2%', left:'48%'}, {top:'92%', left:'50%'},
    {top:'40%', left:'-2%'}, {top:'38%', left:'100%'},
  ];
  sparklePositions.forEach((pos, i)=>{
    const s = document.createElement('span');
    s.className = 'age-sparkle';
    s.textContent = sparkleGlyphs[i % sparkleGlyphs.length];
    s.style.top = pos.top;
    s.style.left = pos.left;
    s.style.animationDelay = (i * 0.35) + 's';
    ageSparkles.appendChild(s);
  });
}

// --- hati & bintang kecil yang melayang pelan di background ---
if(!reduceMotion){
  const layer = document.getElementById('floaties');
  const glyphs = ['🖤','✦','◆','·'];
  const count = window.innerWidth < 640 ? 9 : 14;
  for(let i=0;i<count;i++){
    const el = document.createElement('span');
    el.className = 'floaty';
    el.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    el.style.left = (Math.random()*100) + 'vw';
    el.style.fontSize = (12 + Math.random()*10) + 'px';
    const dur = 14 + Math.random()*12;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (-Math.random()*dur) + 's';
    layer.appendChild(el);
  }
}

// --- musik latar ---
const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');
const musicLabel = document.getElementById('musicLabel');
bgMusic.volume = 0.45;
let playing = false;

function setPlayingState(isPlaying){
  playing = isPlaying;
  musicToggle.classList.toggle('playing', isPlaying);
  musicToggle.setAttribute('aria-pressed', String(isPlaying));
  musicLabel.textContent = isPlaying ? CONTENT.musicOn : CONTENT.musicOff;
}

musicToggle.addEventListener('click', ()=>{
  if(!playing){
    bgMusic.play().then(()=> setPlayingState(true)).catch(()=>{ /* diam-diam gagal, biarin user coba lagi */ });
  } else {
    bgMusic.pause();
    setPlayingState(false);
  }
});

// --- kelip bintang kecil tersebar di layar pembuka ---
if(!reduceMotion){
  const introSparkles = document.getElementById('introSparkles');
  const introGlyphs = ['✦','✧','·'];
  const introPositions = [
    {top:'6%', left:'8%'}, {top:'14%', left:'86%'},
    {top:'82%', left:'12%'}, {top:'88%', left:'82%'},
    {top:'46%', left:'2%'}, {top:'40%', left:'96%'},
    {top:'4%', left:'46%'}, {top:'94%', left:'50%'},
  ];
  introPositions.forEach((pos, i)=>{
    const s = document.createElement('span');
    s.className = 'intro-sparkle';
    s.textContent = introGlyphs[i % introGlyphs.length];
    s.style.top = pos.top;
    s.style.left = pos.left;
    s.style.animationDelay = (i * 0.3) + 's';
    introSparkles.appendChild(s);
  });
}

// --- layar pembuka: buka amplopnya = flap kebuka dulu, baru halaman fade + musik nyala ---
// (browser mewajibkan ada interaksi pengguna sebelum audio boleh bunyi,
// jadi ini cara paling dekat dengan "musik langsung keputer")
const introOverlay = document.getElementById('introOverlay');
const envelopeBtn = document.getElementById('envelopeBtn');
let introOpened = false;

function openIntro(){
  if(introOpened) return;
  introOpened = true;
  envelopeBtn.classList.add('opening');
  setTimeout(()=>{
    bgMusic.play().then(()=> setPlayingState(true)).catch(()=> setPlayingState(false));
    introOverlay.classList.add('hidden');
  }, 680);
}
envelopeBtn.addEventListener('click', openIntro);
envelopeBtn.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openIntro(); }
});
introOverlay.addEventListener('click', (e)=>{
  if(e.target === introOverlay) openIntro();
});
</script>

</body>
</html>
