<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Abang 🖤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ISI / TEKS BISA DIGANTI DI SINI  →  cari objek "CONTENT"
     di bagian <script> paling bawah file ini.
     ============================================================ */

  :root{
    --bg: #1a1420;
    --bg-deep: #120d17;
    --card: #241b2c;
    --cream: #f4ecdf;
    --cream-dim: #cdc0b8;
    --gold: #cf9f5f;
    --gold-soft: #e3c493;
    --rose: #b97b83;
    --line: rgba(244,236,223,0.14);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #2c2033 0%, var(--bg) 55%),
      var(--bg);
    color:var(--cream);
    font-family:'Karla', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(244,236,223,.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 65%, rgba(244,236,223,.35), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(244,236,223,.4), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(244,236,223,.3), transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, rgba(244,236,223,.4), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(244,236,223,.3), transparent),
      radial-gradient(1px 1px at 92% 75%, rgba(244,236,223,.3), transparent);
    background-repeat:repeat;
    background-size:600px 600px;
    opacity:.6;
  }

  /* ---------- floating hearts / sparkles (cute ambient layer) ---------- */
  .floaties{
    position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;
  }
  .floaty{
    position:absolute;
    bottom:-40px;
    font-size:16px;
    opacity:0;
    animation: floatUp linear infinite;
    filter:drop-shadow(0 0 6px rgba(207,159,95,.25));
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.55; }
    50%{ transform:translateY(-52vh) translateX(14px) rotate(8deg); }
    90%{ opacity:.35; }
    100%{ transform:translateY(-102vh) translateX(-10px) rotate(-6deg); opacity:0; }
  }

  .wrap{
    position:relative; z-index:2;
    max-width:600px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- HERO ---------- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 28px 40px;
    position:relative;
    z-index:1;
  }
  .hero .eyebrow{
    font-family:'Karla',sans-serif;
    font-size:15px;
    letter-spacing:.02em;
    color:var(--rose);
    margin-bottom:18px;
  }
  .hero .age{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(90px, 32vw, 190px);
    line-height:.85;
    color:var(--gold-soft);
    margin:0;
    text-shadow: 0 0 60px rgba(207,159,95,0.25);
  }
  .hero .headline{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(26px, 6vw, 38px);
    line-height:1.25;
    margin:22px 0 14px;
    color:var(--cream);
  }
  .hero .sub{
    font-size:16px;
    color:var(--cream-dim);
    max-width:380px;
    line-height:1.6;
  }
  .hero .from{
    margin-top:36px;
    font-size:14px;
    color:var(--cream-dim);
    letter-spacing:.01em;
  }
  .hero .from span{color:var(--rose);}

  /* ---------- CUTE MASCOT ---------- */
  .mascot-holder{
    margin-top:28px;
    display:flex;
    justify-content:center;
  }
  .mascot{
    width:108px; height:108px;
    animation: breathe 3.4s ease-in-out infinite;
    transform-origin:50% 85%;
    cursor:pointer;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1,1) translateY(0); }
    50%{ transform:scale(1.035,0.965) translateY(-3px); }
  }
  .mascot .eye{ transition:transform .12s ease; transform-origin:center; }
  .mascot.blink .eye{ transform:scaleY(0.12); }
  .mascot.jump{ animation: jumpHappy 0.9s ease; }
  @keyframes jumpHappy{
    0%{ transform:translateY(0) scale(1,1); }
    25%{ transform:translateY(-22px) scale(0.96,1.08); }
    45%{ transform:translateY(-26px) scale(1.04,0.94); }
    65%{ transform:translateY(0) scale(0.94,1.08); }
    85%{ transform:translateY(-6px) scale(1.02,0.98); }
    100%{ transform:translateY(0) scale(1,1); }
  }

  .scroll-hint{
    margin-top:38px;
    width:1px; height:46px;
    background:linear-gradient(to bottom, var(--gold), transparent);
    position:relative;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  /* ---------- NOTE SECTIONS ---------- */
  .note{
    padding:70px 0;
    border-top:1px solid var(--line);
    position:relative;
    z-index:1;
  }
  .note .label{
    font-size:13px;
    color:var(--rose);
    margin-bottom:16px;
    display:block;
  }
  .note p{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(19px, 4vw, 23px);
    line-height:1.65;
    color:var(--cream);
    margin:0 0 16px;
  }
  .note p:last-child{margin-bottom:0;}
  .note p em{
    font-style:italic;
    color:var(--gold-soft);
  }

  /* ---------- CANDLE / REVEAL INTERACTION ---------- */
  .candle-section{
    padding:90px 0 100px;
    text-align:center;
    border-top:1px solid var(--line);
    position:relative;
    z-index:1;
  }
  .candle-section .label{
    font-size:13px;
    color:var(--rose);
    display:block;
    margin-bottom:10px;
  }
  .candle-section h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(22px,5vw,28px);
    margin:0 0 40px;
    color:var(--cream);
  }

  .candle-wrap{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    user-select:none;
    background:none;
    border:none;
    padding:0;
    font:inherit;
  }
  .candle-wrap:focus-visible{ outline:2px solid var(--gold); outline-offset:8px; border-radius:8px; }

  .flame{
    width:14px; height:22px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #fff2c9 0%, var(--gold) 45%, #a85f2e 100%);
    margin-bottom:-2px;
    transform-origin:bottom center;
    animation:flicker 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 12px rgba(207,159,95,.8));
  }
  @keyframes flicker{
    0%,100%{ transform:scale(1) rotate(-1deg); }
    50%{ transform:scale(1.08,0.95) rotate(2deg); }
  }
  .candle-body{
    width:20px; height:70px;
    background:linear-gradient(to right, #6b5142, #8a6a55, #6b5142);
    border-radius:3px;
  }
  .candle-caption{
    margin-top:22px;
    font-size:14px;
    color:var(--cream-dim);
  }
  .candle-wrap.blown .flame{ opacity:0; transform:scale(0); }
  .candle-wrap.blown .candle-caption{ opacity:0; }

  .smoke{
    width:2px; height:0px;
    background:rgba(230,225,220,.5);
    margin:0 auto;
    opacity:0;
  }
  .candle-wrap.blown .smoke{
    animation:smoke-rise 1.4s ease-out forwards;
  }
  @keyframes smoke-rise{
    0%{ height:0px; opacity:.6; transform:translateX(0) scaleX(1); }
    100%{ height:60px; opacity:0; transform:translateX(8px) scaleX(3); }
  }

  /* ---------- LETTER (final message) ---------- */
  .letter-section{
    padding:20px 0 110px;
    position:relative;
    z-index:1;
  }
  .letter{
    background:linear-gradient(180deg, var(--card), #1e1626);
    border:1px solid var(--line);
    border-radius:2px;
    padding:44px 34px;
    position:relative;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity 1.1s ease, max-height 1.4s ease;
  }
  .letter.show{
    opacity:1;
    max-height:2000px;
  }
  .letter::before{
    content:'';
    position:absolute;
    top:0; left:34px; right:34px;
    height:1px;
    background:linear-gradient(to right, transparent, var(--gold), transparent);
  }
  .letter .to{
    font-size:13px;
    color:var(--rose);
    margin-bottom:22px;
    display:block;
  }
  .letter h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(24px, 5.5vw, 30px);
    color:var(--gold-soft);
    margin:0 0 26px;
    line-height:1.3;
  }
  .letter p{
    font-family:'Fraunces', serif;
    font-size:clamp(16.5px, 3.6vw, 18px);
    line-height:1.85;
    color:var(--cream);
    margin:0 0 18px;
  }
  .letter p:last-of-type{margin-bottom:0;}
  .letter .sign{
    margin-top:30px;
    font-style:italic;
    color:var(--gold-soft);
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:50px 28px 70px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--cream-dim);
    letter-spacing:.02em;
    position:relative;
    z-index:1;
  }
  footer .heart{
    color:var(--rose);
    display:block;
    margin-bottom:10px;
    font-size:20px;
  }

  /* ---------- MUSIC TOGGLE ---------- */
  .music-toggle{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:5;
    display:flex;
    align-items:center;
    gap:9px;
    background:rgba(36,27,44,0.88);
    border:1px solid var(--line);
    color:var(--cream);
    font-family:'Karla',sans-serif;
    font-size:13px;
    padding:10px 16px 10px 12px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 22px rgba(0,0,0,.35);
    transition:transform .2s ease, background .2s ease;
  }
  .music-toggle:hover{ transform:translateY(-2px); }
  .music-toggle:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .note-icon{
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }
  .music-toggle.playing .note-icon{ animation: noteBob 1s ease-in-out infinite; }
  @keyframes noteBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3px) rotate(-8deg); }
  }
  .music-bars{ display:flex; align-items:flex-end; gap:2px; height:12px; }
  .music-bars span{
    width:2.5px; background:var(--gold-soft); border-radius:2px; height:4px;
    animation:none;
  }
  .music-toggle.playing .music-bars span{ animation:bar 0.9s ease-in-out infinite; }
  .music-bars span:nth-child(1){ animation-delay:0s; }
  .music-bars span:nth-child(2){ animation-delay:.15s; }
  .music-bars span:nth-child(3){ animation-delay:.3s; }
  @keyframes bar{
    0%,100%{ height:4px; }
    50%{ height:12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .flame, .scroll-hint, .mascot, .floaty, .music-toggle.playing .note-icon, .music-bars span{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="floaties" id="floaties"></div>

<audio id="bgMusic" src="bg_music.mp3" loop preload="auto"></audio>
<button class="music-toggle" id="musicToggle" aria-pressed="false">
  <span class="note-icon">🎵</span>
  <span class="music-bars"><span></span><span></span><span></span></span>
  <span id="musicLabel" data-c="musicOff"></span>
</button>

<div class="wrap">

  <section class="hero">
    <span class="eyebrow" data-c="heroEyebrow"></span>
    <p class="age" data-c="heroAge"></p>
    <h1 class="headline" data-c="heroHeadline"></h1>
    <p class="sub" data-c="heroSub"></p>

    <div class="mascot-holder">
      <svg class="mascot" id="mascot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="60" cy="108" rx="30" ry="6" fill="#000" opacity="0.18"/>
        <path d="M60 20c26 0 42 18 42 44s-18 46-42 46-42-20-42-46S34 20 60 20z" fill="#efc9c9"/>
        <ellipse cx="30" cy="70" rx="9" ry="7" fill="#f3d7d2"/>
        <ellipse cx="90" cy="70" rx="9" ry="7" fill="#f3d7d2"/>
        <circle cx="42" cy="70" r="6" fill="#e39a95" opacity="0.7"/>
        <circle cx="78" cy="70" r="6" fill="#e39a95" opacity="0.7"/>
        <g class="eye">
          <ellipse cx="47" cy="60" rx="4.2" ry="5.4" fill="#3a2a2f"/>
          <circle cx="48.4" cy="57.8" r="1.3" fill="#fff"/>
        </g>
        <g class="eye">
          <ellipse cx="73" cy="60" rx="4.2" ry="5.4" fill="#3a2a2f"/>
          <circle cx="74.4" cy="57.8" r="1.3" fill="#fff"/>
        </g>
        <path d="M53 74q7 6 14 0" stroke="#3a2a2f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M46 34c4-8 24-8 28 0" stroke="#cf9f5f" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M55 30l5-9 5 9z" fill="#cf9f5f"/>
      </svg>
    </div>

    <p class="from" data-c="heroFrom"></p>
    <div class="scroll-hint"></div>
  </section>

  <section class="note">
    <span class="label" data-c="note1Label"></span>
    <div data-c-html="note1Body"></div>
  </section>

  <section class="note">
    <span class="label" data-c="note2Label"></span>
    <div data-c-html="note2Body"></div>
  </section>

  <section class="candle-section">
    <span class="label" data-c="candleLabel"></span>
    <h3 data-c="candleHeadline"></h3>
    <button class="candle-wrap" id="candleBtn" aria-label="Tiup lilinnya untuk membuka pesan">
      <div class="flame"></div>
      <div class="candle-body"></div>
      <div class="smoke"></div>
      <p class="candle-caption" data-c="candleCaption"></p>
    </button>
  </section>

  <section class="letter-section">
    <div class="letter" id="letterBox">
      <span class="to" data-c="letterTo"></span>
      <h2 data-c="letterTitle"></h2>
      <div data-c-html="letterBody"></div>
      <p class="sign" data-c="letterSign"></p>
    </div>
  </section>

  <footer>
    <span class="heart">🤍</span>
    <span data-c="footer"></span>
  </footer>

</div>

<script>
/* ============================================================
   SEMUA TEKS DI WEBSITE INI ADA DI SINI.
   Ganti isinya sesuka hati — nggak perlu ubah bagian lain.
   Boleh pakai tag <br> untuk ganti baris, dan <em>...</em>
   untuk bikin kata jadi miring.
   ============================================================ */
const CONTENT = {

  // ===== HERO (bagian paling atas) =====
  heroEyebrow: "untuk abang, dari aku",
  heroAge: "24",
  heroHeadline: "Selamat ulang tahun, sayang. 🖤",
  heroSub: "Scroll pelan-pelan ya, abang. Ada beberapa hal yang mau aku bilang.",
  heroFrom: "dengan sayang, <span>aku</span>",

  // ===== NOTE 1 =====
  note1Label: "buat abang",
  note1Body: `
    <p>Selamat ulang tahun, abang. 🖤 Nggak kerasa ya, sekarang abang udah 24 tahun.</p>
    <p>Aku nggak jago bikin kata-kata manis, tapi aku beneran seneng bisa ngerayain hari ini buat kamu.</p>
  `,

  // ===== NOTE 2 =====
  note2Label: "sedikit cerita",
  note2Body: `
    <p>Di umur abang yang ke-<em>24</em> ini, aku cuma mau bilang, makasih ya udah ada di hidup aku.</p>
    <p>Aku mungkin nggak selalu bilang, tapi aku sayang banget sama kamu.</p>
  `,

  // ===== BAGIAN LILIN (interaktif) =====
  candleLabel: "sebelum lanjut",
  candleHeadline: "Tiup lilinnya dulu, abang.",
  candleCaption: "(tap lilinnya)",

  // ===== SURAT / PESAN UTAMA =====
  letterTo: "untuk abang sayang",
  letterTitle: "Selamat ulang tahun yang ke-24, abang sayang. 🖤",
  letterBody: `
    <p>Nggak kerasa ya, sekarang abang udah 24 tahun. Semoga di umur yang baru ini, abang selalu sehat, dimudahkan semua urusannya, dan pelan-pelan hal yang abang impikan bisa tercapai.</p>
    <p>Aku mungkin nggak selalu bisa jadi yang paling sempurna buat abang, tapi aku selalu pengen yang terbaik buat kamu.</p>
    <p>Makasih ya, sayang, untuk semua cerita, semua tawa, semua waktu, dan hal-hal kecil yang udah kita lewatin bareng.</p>
    <p>Semoga nanti kita punya lebih banyak cerita lagi.</p>
    <p>Sekali lagi, selamat ulang tahun, abang. 🤍</p>
  `,
  letterSign: "I love you.",

  // ===== FOOTER =====
  footer: "dibikin khusus buat abang, sama sayangnya aku.",

  // ===== MUSIK =====
  musicOff: "nyalain musik",
  musicOn: "lagi muter",
};

// --- render semua teks dari CONTENT ke halaman ---
document.querySelectorAll('[data-c]').forEach(el=>{
  const key = el.getAttribute('data-c');
  if(CONTENT[key] !== undefined) el.innerHTML = CONTENT[key];
});
document.querySelectorAll('[data-c-html]').forEach(el=>{
  const key = el.getAttribute('data-c-html');
  if(CONTENT[key] !== undefined) el.innerHTML = CONTENT[key];
});

// --- interaksi lilin: tiup lilin -> pesan muncul + maskotnya loncat seneng ---
const candleBtn = document.getElementById('candleBtn');
const letterBox = document.getElementById('letterBox');
const mascot = document.getElementById('mascot');
candleBtn.addEventListener('click', ()=>{
  if(candleBtn.classList.contains('blown')) return;
  candleBtn.classList.add('blown');
  mascot.classList.add('jump');
  setTimeout(()=> mascot.classList.remove('jump'), 950);
  setTimeout(()=>{
    letterBox.classList.add('show');
    letterBox.scrollIntoView({behavior:'smooth', block:'center'});
  }, 500);
});

// --- maskot: kedip pelan-pelan tiap beberapa detik, loncat kalau di-tap ---
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduceMotion){
  setInterval(()=>{
    mascot.classList.add('blink');
    setTimeout(()=> mascot.classList.remove('blink'), 160);
  }, 2600 + Math.random()*1400);
}
mascot.addEventListener('click', ()=>{
  mascot.classList.add('jump');
  setTimeout(()=> mascot.classList.remove('jump'), 950);
});

// --- hati & bintang kecil yang melayang pelan di background ---
if(!reduceMotion){
  const layer = document.getElementById('floaties');
  const glyphs = ['🤍','✦','🖤','·'];
  const count = window.innerWidth < 640 ? 9 : 14;
  for(let i=0;i<count;i++){
    const el = document.createElement('span');
    el.className = 'floaty';
    el.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    el.style.left = (Math.random()*100) + 'vw';
    el.style.fontSize = (12 + Math.random()*10) + 'px';
    const dur = 14 + Math.random()*12;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (-Math.random()*dur) + 's';
    layer.appendChild(el);
  }
}

// --- toggle musik latar ---
const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');
const musicLabel = document.getElementById('musicLabel');
bgMusic.volume = 0.45;
let playing = false;
musicToggle.addEventListener('click', ()=>{
  if(!playing){
    bgMusic.play().then(()=>{
      playing = true;
      musicToggle.classList.add('playing');
      musicToggle.setAttribute('aria-pressed','true');
      musicLabel.textContent = CONTENT.musicOn;
    }).catch(()=>{ /* diam-diam gagal, biarin user coba lagi */ });
  } else {
    bgMusic.pause();
    playing = false;
    musicToggle.classList.remove('playing');
    musicToggle.setAttribute('aria-pressed','false');
    musicLabel.textContent = CONTENT.musicOff;
  }
});
</script>

</body>
</html>
